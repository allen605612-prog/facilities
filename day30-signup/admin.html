<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>報名管理後台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }
    h1 { font-size: 1.4rem; color: #90cdf4; margin-bottom: 4px; }
    .subtitle { font-size: 0.8rem; color: #718096; margin-bottom: 20px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .user-info { font-size: 0.85rem; color: #a0aec0; text-align: right; }
    .summary { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .card {
      background: #1a202c;
      border-radius: 10px;
      padding: 16px 24px;
      min-width: 150px;
      border: 1px solid #2d3748;
    }
    .card-label { font-size: 0.75rem; color: #718096; margin-bottom: 4px; }
    .card-value { font-size: 1.4rem; font-weight: bold; color: #e2e8f0; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a202c;
      border-radius: 10px;
      overflow: hidden;
    }
    th {
      background: #2d3748;
      padding: 12px 16px;
      text-align: left;
      font-size: 0.8rem;
      color: #a0aec0;
      font-weight: 500;
      white-space: nowrap;
    }
    td {
      padding: 12px 16px;
      font-size: 0.9rem;
      border-top: 1px solid #2d3748;
      vertical-align: top;
    }
    td:first-child { color: #90cdf4; font-weight: 600; }
    tr:hover { background: #2d3748; }
    .table-wrap { overflow-x: auto; border-radius: 10px; }

    .center-box {
      max-width: 420px;
      margin: 10vh auto 0;
      background: #1a202c;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 40px 32px;
      text-align: center;
    }
    .center-box h2 { font-size: 1.2rem; margin-bottom: 12px; color: #e2e8f0; }
    .center-box p { font-size: 0.85rem; color: #718096; margin-bottom: 24px; line-height: 1.7; }
    .btn {
      display: inline-block;
      padding: 10px 24px;
      background: #2b6cb0;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #2c5282; }
    .btn.ghost {
      background: transparent;
      border: 1px solid #2d3748;
      color: #a0aec0;
      font-size: 0.8rem;
      padding: 6px 14px;
      font-weight: 400;
    }
    .btn.ghost:hover { background: #2d3748; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      background: #2d3748;
      color: #a0aec0;
      white-space: nowrap;
    }
    footer { margin-top: 16px; font-size: 0.75rem; color: #4a5568; }
    footer a { color: #718096; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- 登入畫面 -->
  <div id="view-login" class="center-box hidden">
    <h2>🔐 管理者登入</h2>
    <p>此頁面僅限管理者使用。<br>請使用 Google 帳號登入，系統會核對管理者名單。</p>
    <button class="btn" onclick="loginWithGoogle()">使用 Google 登入</button>
  </div>

  <!-- 非管理者畫面 -->
  <div id="view-denied" class="center-box hidden">
    <h2>⛔ 沒有存取權限</h2>
    <p id="denied-email"></p>
    <p>你的帳號不在管理者名單中，無法檢視報名資料。</p>
    <button class="btn ghost" onclick="logout()">登出，換帳號登入</button>
  </div>

  <!-- 管理者後台 -->
  <div id="view-admin" class="hidden">
    <div class="topbar">
      <div>
        <h1>📋 報名管理後台</h1>
        <div class="subtitle">AI 工具實作工作坊｜報名資料一覽</div>
      </div>
      <div class="user-info">
        <div id="admin-email"></div>
        <button class="btn ghost" style="margin-top:6px" onclick="logout()">登出</button>
      </div>
    </div>

    <div class="summary">
      <div class="card">
        <div class="card-label">報名筆數</div>
        <div class="card-value" id="count-rows">—</div>
      </div>
      <div class="card">
        <div class="card-label">總參加人數</div>
        <div class="card-value" id="count-people">—</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>姓名</th><th>Email</th><th>電話</th><th>場次</th><th>人數</th><th>備註</th><th>報名時間</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7" style="text-align:center;color:#718096;padding:32px">載入中...</td></tr>
        </tbody>
      </table>
    </div>

    <footer><a href="index.html">← 回報名頁</a></footer>
  </div>

  <script>
    const SUPABASE_URL = 'https://zupszmcwtkbdbavkzsqu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1cHN6bWN3dGtiZGJhdmt6c3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2ODU2NzMsImV4cCI6MjA5ODI2MTY3M30.HvXQUh7B2l0esE5WSWiSr20UGQZluwFHMwKRFYbdhyQ';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function show(id) {
      ['view-login', 'view-denied', 'view-admin'].forEach(v =>
        document.getElementById(v).classList.toggle('hidden', v !== id));
    }

    async function loginWithGoogle() {
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname },
      });
    }

    async function logout() {
      await sb.auth.signOut();
      show('view-login');
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function loadResponses(session) {
      document.getElementById('admin-email').textContent = '👤 ' + session.user.email;
      show('view-admin');

      const { data, error } = await sb
        .from('survey_responses')
        .select('*')
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('tbody');
      if (error) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#fc8181;padding:32px">❌ ${esc(error.message)}</td></tr>`;
        return;
      }
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#718096;padding:32px">目前還沒有人報名</td></tr>';
        document.getElementById('count-rows').textContent = '0';
        document.getElementById('count-people').textContent = '0';
        return;
      }

      document.getElementById('count-rows').textContent = data.length;
      document.getElementById('count-people').textContent =
        data.reduce((sum, r) => sum + (r.attendees || 0), 0) + ' 人';

      tbody.innerHTML = data.map(r => `<tr>
        <td>${esc(r.name)}</td>
        <td>${esc(r.email)}</td>
        <td>${esc(r.phone) || '—'}</td>
        <td><span class="badge">${esc(r.session)}</span></td>
        <td>${r.attendees}</td>
        <td>${esc(r.note) || '—'}</td>
        <td style="white-space:nowrap;color:#718096">${new Date(r.created_at).toLocaleString('zh-TW')}</td>
      </tr>`).join('');
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        show('view-login');
        return;
      }
      // 用 is_admin() 判斷是否在管理者名單
      const { data: isAdmin, error } = await sb.rpc('is_admin');
      if (error || !isAdmin) {
        document.getElementById('denied-email').textContent = '目前登入：' + session.user.email;
        show('view-denied');
        return;
      }
      await loadResponses(session);
    }

    // OAuth 導回後 session 建立完成時重新初始化
    sb.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_IN') init();
    });

    init();
  </script>
</body>
</html>
